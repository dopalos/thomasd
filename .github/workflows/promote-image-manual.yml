name: promote-image-manual

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Source tag (e.g., candidate)'
        required: false
        default: 'candidate'
      to_tags:
        description: 'Destination tags (comma-separated, e.g., latest or latest,v0.1.27)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote
        env:
          FROM: ${{ inputs.from_tag }}
          TO:   ${{ inputs.to_tags }}
        run: |
          IFS=',' read -ra T <<< "$TO"
          TAG_ARGS=()
          for t in "${T[@]}"; do
            t=$(echo "$t" | xargs)
            [ -n "$t" ] && TAG_ARGS+=( --tag "${IMAGE}:${t}" )
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${IMAGE}:${FROM}"

      - name: Verify digests
        env:
          FROM: ${{ inputs.from_tag }}
          TO:   ${{ inputs.to_tags }}
        run: |
          S=$(docker buildx imagetools inspect "${IMAGE}:${FROM}" --format "{{ .Manifest.Digest }}")
          IFS=',' read -ra T <<< "$TO"
          for t in "${T[@]}"; do
            t=$(echo "$t" | xargs)
            D=$(docker buildx imagetools inspect "${IMAGE}:${t}" --format "{{ .Manifest.Digest }}")
            echo "${t}=${D}"
            test "$S" = "$D"
          done
