name: release-binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.10)
        required: true

env:
  BIN_NAME: thomasd
  BUILD_DIR: cmd/thomasd
  GO_VERSION: 1.25.x

jobs:
  resolve-tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - name: Set tag
        id: set
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || '' }}"
          if [ -z "$TAG" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "Could not resolve tag. Pass 'tag' input or run on tag push/release." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

  build:
    name: Build & package (${{ matrix.goos }}, ${{ matrix.goarch }}, ${{ matrix.archive }})
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, archive: tar.gz, ext: "" }
          - { goos: linux,   goarch: arm64, archive: tar.gz, ext: "" }
          - { goos: darwin,  goarch: amd64, archive: tar.gz, ext: "" }
          - { goos: darwin,  goarch: arm64, archive: tar.gz, ext: "" }
          - { goos: windows, goarch: amd64, archive: zip,    ext: ".exe" }
          - { goos: windows, goarch: arm64, archive: zip,    ext: ".exe" }
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          OUT="dist/bin/${BIN_NAME}${{ matrix.ext }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -X 'main.version=${TAG}'" \
            -o "${OUT}" "./${BUILD_DIR}"
          if [ -z "${{ matrix.ext }}" ]; then chmod +x "${OUT}"; fi

      - name: Package (${{ matrix.archive }})
        run: |
          set -euo pipefail
          NAME="${BIN_NAME}_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C dist/bin -czf "dist/${NAME}.tar.gz" "${BIN_NAME}"
          else
            (cd dist/bin && zip -q "../${NAME}.zip" "${BIN_NAME}${{ matrix.ext }}")
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ env.BIN_NAME }}_${{ env.TAG }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    name: Create/Update GitHub Release
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # optional but handy to flatten all artifacts:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            **/*.tar.gz
            **/*.zip
          fail_on_unmatched_files: true
          # token not strictly required (defaults to GITHUB_TOKEN), but explicit is fine:
          token: ${{ secrets.GITHUB_TOKEN }}
