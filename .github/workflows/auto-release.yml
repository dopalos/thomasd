name: auto-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)create release for (e.g. v0.1.11)"
        required: true

permissions:
  contents: write

# 런 제목에 태그가 보이도록
run-name: "auto-release → ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) }}"

concurrency:
  group: auto-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: r
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ -n "$tag" ]] || { echo "Could not resolve tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $tag"

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.r.outputs.tag }}
          name:     ${{ steps.r.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.r.outputs.tag, '-rc') || contains(steps.r.outputs.tag, '-beta') || contains(steps.r.outputs.tag, '-alpha') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
