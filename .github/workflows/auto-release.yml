name: auto-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.8)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release (auto notes)
        uses: softprops/action-gh-release@v2
        with:
          # 수동 실행이면 inputs.tag, 아니면 ref_name 사용
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name:     ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(inputs.tag != '' && inputs.tag || github.ref_name, '-rc') || contains(inputs.tag != '' && inputs.tag || github.ref_name, '-beta') || contains(inputs.tag != '' && inputs.tag || github.ref_name, '-alpha') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
