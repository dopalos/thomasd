name: auto-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create release for (e.g. v0.1.10)"
        required: false

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: t
        shell: bash
        run: |
          set -euo pipefail
          TAG=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          [[ -n "$TAG" ]] || { echo "No tag found"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"

      - name: Create GitHub Release (auto notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          name:     ${{ steps.t.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.t.outputs.tag, '-rc') || contains(steps.t.outputs.tag, '-beta') || contains(steps.t.outputs.tag, '-alpha') }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
