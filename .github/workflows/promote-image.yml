name: promote-image

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Source tag (already exists, e.g. ci-20250909131211)"
        required: true
        type: string
      tags:
        description: "Comma-separated target tags (e.g. latest,v0.1.26)"
        required: true
        type: string

permissions:    # << 중요한 부분: GHCR 쓰기 권한
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR (GITHUB_TOKEN)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Check source image exists
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.from }}"
          echo "Inspect $SRC"
          docker buildx imagetools inspect "$SRC" >/dev/null
          echo "OK"

      - name: Promote tags without rebuild
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.from }}"
          IFS=',' read -ra TARGETS <<< "${{ inputs.tags }}"
          for t in "${TARGETS[@]}"; do
            t="$(echo "$t" | xargs)"   # trim
            [ -n "$t" ] || continue
            DST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$t"
            echo ">> $SRC  ->  $DST"
            docker buildx imagetools create --tag "$DST" "$SRC"
          done
          echo "done."
