# .github/workflows/promote-image.yml
name: promote-image

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Source tag or digest (e.g. ci-20250909131211 or sha256:...)"
        required: true
        type: string
      tags:
        description: "Target tags (comma or space separated), e.g. latest v0.1.26"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1) PAT이 있으면 우선 사용
      - name: Login to GHCR (PAT)
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 2) 없으면 GITHUB_TOKEN 사용 (permissions.packages: write 필수)
      - name: Login to GHCR (GITHUB_TOKEN)
        if: ${{ secrets.GHCR_TOKEN == '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Enable buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize inputs
        id: i
        shell: bash
        run: |
          set -euo pipefail
          FROM_RAW="${{ inputs.from }}"
          FROM="ghcr.io/${{ github.repository }}:${FROM_RAW}"
          TAGS_RAW="${{ inputs.tags }}"
          IFS=', ' read -ra ARR <<< "$TAGS_RAW"
          # -t args를 널 구분자로 파일에 저장 (공백/콤마 모두 지원)
          ARGS=()
          for t in "${ARR[@]}"; do
            [[ -n "${t:-}" ]] || continue
            ARGS+=("-t" "ghcr.io/${{ github.repository }}:${t}")
          done
          printf '%s\0' "${ARGS[@]}" > tags.args
          echo "from=${FROM}" >> "$GITHUB_OUTPUT"

      - name: Promote tags (server-side retag via imagetools)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' ARGS < tags.args
          # 기존 이미지를 재빌드/푸시 없이 새 태그로 복제
          docker buildx imagetools create "${ARGS[@]}" "${{ steps.i.outputs.from }}"
