name: promote-image

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Source tag (e.g., ci-20250909131211)"
        required: true
        type: string
      tags:
        description: "Comma-separated dest tags (e.g., latest,v0.1.26)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR (PAT if provided; else use GITHUB_TOKEN)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ secrets.GHCR_TOKEN }}" ]]; then
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          else
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          fi

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Promote tags without rebuild
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          FROM:  ${{ inputs.from }}
          TAGS:  ${{ inputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a DEST <<< "$TAGS"
          for t in "${DEST[@]}"; do
            echo ">> Tagging $IMAGE:$FROM -> $IMAGE:$t"
            docker buildx imagetools create --tag "$IMAGE:$t" "$IMAGE:$FROM"
          done