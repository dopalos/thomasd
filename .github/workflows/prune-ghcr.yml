name: prune-ghcr-ci-tags

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Auth gh
        run: echo "${{ github.token }}" | gh auth login --with-token

      - name: Prune ci-* (keep 20)
        env:
          OWNER: ${{ github.repository_owner }}
          REPO:  ${{ github.event.repository.name || github.repository }}
        run: |
          set -euo pipefail
          PKG="${REPO#*/}"
          LIST="/orgs/${OWNER}/packages/container/${PKG}/versions?per_page=100"
          DEL="/orgs/${OWNER}/packages/container/${PKG}/versions"
          if ! gh api "$LIST" >/dev/null 2>&1; then
            LIST="/users/${OWNER}/packages/container/${PKG}/versions?per_page=100"
            DEL="/users/${OWNER}/packages/container/${PKG}/versions"
          fi
          VERS=$(gh api "$LIST")
          IDS=$(echo "$VERS" | jq -r '
            sort_by(.updated_at) | reverse |
            map(select([.metadata.container.tags[]?] | any(startswith("ci-")))) |
            .[20:] // [] | .[].id
          ')
          for id in $IDS; do gh api -X DELETE "${DEL}/${id}" || true; done
