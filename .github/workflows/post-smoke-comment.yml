name: post-smoke-comment

on:
  workflow_run:
    workflows: ["light-smoke (CI)"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  comment:
    # 성공/실패일 때만 코멘트 남김 (취소/스킵 제외)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from triggering run
        uses: actions/download-artifact@v4
        with:
          # 다른 워크플로우(run)에서 받은 것이므로 run-id 지정이 필수
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          merge-multiple: true

      - name: Build body & resolve target (PR or commit)
        id: prep
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCL: ${{ github.event.workflow_run.conclusion }}
          RUN_UPDATED: ${{ github.event.workflow_run.updated_at }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          mkdir -p artifacts
          cd artifacts

          m() { [ -f "$1" ] && echo "✅" || echo "⚠️ (missing)"; }

          {
            echo "### light-smoke (CI) — Latest"
            echo "- Run: ${RUN_URL}"
            echo "- Status: ${RUN_STATUS} / Conclusion: ${RUN_CONCL}"
            echo "- Updated: ${RUN_UPDATED}"
            echo
            echo "#### Artifacts"
            echo "- smoke.log: $(m smoke.log)"
            echo "- metrics_diff.txt: $(m metrics_diff.txt)"
            echo "- metrics_after.txt: $(m metrics_after.txt)"
            echo "- router.log: $(m router.log)"
            echo
          } > body.md

          add_block () {
            local title="$1" file="$2" mode="$3" n="$4"
            [ -f "$file" ] || return 0
            {
              echo
              echo "#### ${title}"
              echo '```text'
              if [ "$mode" = "tail" ]; then
                tail -n "$n" -- "$file" || true
              else
                head -n "$n" -- "$file" || true
              fi
              echo '```'
            } >> body.md
          }

          add_block "smoke.log (last 40 lines)"              "smoke.log"         tail 40
          add_block "metrics_diff.txt (first 120 lines)"     "metrics_diff.txt"  head 120
          add_block "metrics_after.txt (first 60 lines)"     "metrics_after.txt" head 60
          add_block "router.log (last 30 lines)"             "router.log"        tail 30

          cat >> body.md <<'MD'

---
@codex

### Action
- Keep this PR rebased to main
- Let light-smoke (CI) run automatically on merge
- After merge:
  - Trigger light-smoke (CI) on main
  - Reply with run link & artifact snippets
MD

          # 1) workflow_run payload에서 PR 번호 시도
          pr_num="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"

          # 2) 없다면 HEAD 브랜치로 PR 검색 (open 우선, 없으면 closed)
          if [ -z "${pr_num}" ] && [ -n "${HEAD_BRANCH:-}" ]; then
            q="repo:${REPO}+type:pr+head:${HEAD_BRANCH}+state:open"
            pr_num="$(gh api -X GET "search/issues" -f q="${q}" --jq '.items[0].number' 2>/dev/null || true)"
            if [ -z "${pr_num}" ] || [ "${pr_num}" = "null" ]; then
              q="repo:${REPO}+type:pr+head:${HEAD_BRANCH}+state:closed"
              pr_num="$(gh api -X GET "search/issues" -f q="${q}" --jq '.items[0].number' 2>/dev/null || true)"
            fi
          fi

          echo "pr_number=${pr_num}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Post comment to PR or commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          PR="${{ steps.prep.outputs.pr_number }}"
          SHA="${{ steps.prep.outputs.head_sha }}"
          if [ -n "$PR" ] && [ "$PR" != "null" ]; then
            # PR 코멘트는 gh pr comment가 가장 안전
            gh pr comment "$PR" --body-file body.md
            echo "commented on PR #$PR"
          else
            # 커밋 코멘트는 REST API 사용
            gh api -X POST "repos/${GITHUB_REPOSITORY}/commits/${SHA}/comments" \
              -f body="$(cat body.md)"
            echo "commented on commit $SHA"
          fi
