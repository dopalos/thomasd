name: post-smoke-comment

on:
  workflow_run:
    workflows: ["light-smoke (CI)"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts from triggering run
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts
          merge_multiple: true

      - name: Build comment body
        id: build
        shell: bash
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_STATUS: ${{ github.event.workflow_run.status }}
          RUN_CONCL: ${{ github.event.workflow_run.conclusion }}
          RUN_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail
          cd artifacts || { mkdir -p artifacts && cd artifacts; }

          exists() { test -f "$1"; }

          body="$(cat <<'EOF'
### light-smoke (CI) — Latest
- Run: RUN_URL
- Status: RUN_STATUS / Conclusion: RUN_CONCL
- Updated: RUN_UPDATED

#### Artifacts
- smoke.log: SMOKE_MARK
- metrics_diff.txt: DIFF_MARK
- metrics_after.txt: AFTER_MARK
- router.log: ROUTER_MARK

EOF
)"

          mark_ok="✅"; mark_miss="⚠️ (missing)"
          s_mark="$mark_miss"; d_mark="$mark_miss"; a_mark="$mark_miss"; r_mark="$mark_miss"

          if exists smoke.log; then s_mark="$mark_ok"; fi
          if exists metrics_diff.txt; then d_mark="$mark_ok"; fi
          if exists metrics_after.txt; then a_mark="$mark_ok"; fi
          if exists router.log; then r_mark="$mark_ok"; fi

          body="${body/RUN_URL/$RUN_URL}"
          body="${body/RUN_STATUS/$RUN_STATUS}"
          body="${body/RUN_CONCL/$RUN_CONCL}"
          body="${body/RUN_UPDATED/$RUN_UPDATED}"
          body="${body/SMOKE_MARK/$s_mark}"
          body="${body/DIFF_MARK/$d_mark}"
          body="${body/AFTER_MARK/$a_mark}"
          body="${body/ROUTER_MARK/$r_mark}"

          add_block () {
            local title="$1"; shift
            local file="$1"; shift
            local head_or_tail="$1"; shift
            local n="$1"; shift
            if exists "$file"; then
              printf '\n#### %s\n```text\n' "$title" >> body.md
              if [ "$head_or_tail" = "tail" ]; then tail -n "$n" -- "$file" >> body.md || true
              else head -n "$n" -- "$file" >> body.md || true
              fi
              printf '```\n' >> body.md
            fi
          }

          printf "%s\n" "$body" > body.md
          add_block "smoke.log (last 40 lines)" "smoke.log" "tail" 40
          add_block "metrics_diff.txt (first 120 lines)" "metrics_diff.txt" "head" 120
          add_block "metrics_after.txt (first 60 lines)" "metrics_after.txt" "head" 60
          add_block "router.log (last 30 lines)" "router.log" "tail" 30

          cat >>body.md <<'MD'

---
@codex

### Action
- Keep this PR rebased to main
- Let light-smoke (CI) run automatically on merge
- After merge:
  - Trigger light-smoke (CI) on main
  - Reply with run link & artifact snippets
MD

          # 추적 정보
          pr_number=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH" || true)
          commit_sha=$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Post comment to PR or commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          pr="${{ steps.build.outputs.pr_number }}"
          sha="${{ steps.build.outputs.commit_sha }}"
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --body-file artifacts/body.md
            echo "commented on PR #$pr"
          else
            gh api repos/${{ github.repository }}/commits/$sha/comments -f body="$(cat artifacts/body.md)"
            echo "commented on commit $sha"
          fi
