name: docker-images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to publish (e.g., v0.1.24). If empty, branch name is used."
        required: false
        type: string
      app_main:
        description: "Main package path (e.g., ./cmd/thomasd). Leave empty to auto-detect."
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag (never fail)
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag || '' }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            TAG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Debug: show ref & Dockerfile head
        run: |
          echo "REF: ${{ github.ref }}  HEAD_REF: ${{ github.head_ref }}"
          git log -1 --oneline -- Dockerfile || true
          head -n 60 Dockerfile || sed -n "1,60p" Dockerfile


      - uses: docker/setup-qemu-action@v3
      - id: buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve_tag.outputs.tag }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=thomasd
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - id: dp
        uses: docker/build-push-action@v6
        with:
          no-cache: true
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.resolve_tag.outputs.tag }}
            APP_MAIN=${{ github.event.inputs.app_main }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
