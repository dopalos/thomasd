name: docker-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.24)"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.inputs.tag || '' }}" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "no tag" >&2; exit 1
          fi

  build-push:
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve-tag.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - name: Build & push (linux/amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.run_started_at }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  sign:
    needs: [resolve-tag, build-push]
    runs-on: ubuntu-latest
    env:
      COSIGN_YES: "true"
      COSIGN_EXPERIMENTAL: "true"
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless OIDC)
        shell: bash
        run: |
          set -euo pipefail
          for t in "${TAG}" latest; do
            cosign sign --yes "${IMAGE}:${t}"
          done

  smoke:
    needs: [resolve-tag, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Pull & run container, then curl /health
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker run -d --rm --name thomasd -p 8081:8081 "$IMAGE"
          sleep 1
          curl -fsS http://127.0.0.1:8081/health
          docker stop thomasd