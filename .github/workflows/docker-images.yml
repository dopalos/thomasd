name: docker-images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to publish (e.g., v0.1.24). If empty, branch name is used.'
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag (never fail)
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          # 1) workflow_dispatch 입력이 있으면 우선
          if [[ -n "${{ github.event.inputs.tag || '' }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          # 2) 태그 이벤트면 그 태그
          elif [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            # 3) 브랜치/PR/수동(입력없음): 브랜치 이름을 태그로 사용 (소문자/문자 제한)
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            TAG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - id: buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 항상 안전한 태그 하나는 보장
            type=raw,value=${{ steps.resolve_tag.outputs.tag }}
            # 커밋 고유 식별자
            type=sha
            # main 또는 태그 이벤트일 때만 latest도 추가
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=thomasd
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - id: dp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.resolve_tag.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
