name: docker-images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.24)"
        required: true
        type: string
permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/thomasd
jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag:     ${{ steps.out.outputs.tag }}
      tag_nov: ${{ steps.out.outputs.tag_nov }}
    steps:
      - id: out
        shell: bash
        run: |
          v='${{ inputs.tag }}'
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "tag_nov=${v#v}" >> "$GITHUB_OUTPUT"
  build-push:
    name: build-push
    runs-on: ubuntu-latest
    needs: resolve-tag
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.resolve-tag.outputs.tag }}
            type=raw,value=${{ needs.resolve-tag.outputs.tag_nov }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.resolve-tag.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
  sign:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Sign (by digest)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/docker-images.yml@${{ github.ref }}" \
            ${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}
  smoke:
    runs-on: ubuntu-latest
    needs: [build-push, sign]
    steps:
      - name: Run container & check health
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}"
          docker run -d --rm -p 8081:8081 --name thomasd "$image"
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:8081/health; then
              break
            fi
            sleep 1
          done
          docker rm -f thomasd || true