name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach assets to (e.g. v0.1.11)"
        required: true

permissions:
  contents: write

# 런 제목에 태그가 보이도록
run-name: "release-assets → ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"

concurrency:
  # 태그별로 격리하고 싶으면 run_id 사용(중첩 취소 방지)
  group: release-assets-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: windows-2022
    steps:
      - name: Resolve tag
        id: r
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Could not resolve tag. Pass 'tag' input." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved tag: $tag"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Merge OpenAPI fragments
        shell: pwsh
        run: |
          .\tools\openapi\merge_openapi.ps1
          if (!(Test-Path .\server\static\openapi\merged.json)) { throw "merged.json not generated" }

      - name: Generate Postman collection
        shell: pwsh
        run: |
          .\tools\openapi\write-postman.ps1 -Merged .\server\static\openapi\merged.json -Out .\dist\thomasd-postman.json -BaseForVar "http://127.0.0.1:62533"
          if (!(Test-Path .\dist\thomasd-postman.json)) { throw "Postman collection not generated" }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.r.outputs.tag }}
          files: |
            server/static/openapi/merged.json
            dist/thomasd-postman.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
