name: docker-images-manual

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to publish (e.g., v0.1.24). If empty, branch name is used."
        required: false
        type: string
      app_main:
        description: "Main package path (e.g., ./cmd/thomasd). Leave empty to auto-detect."
        required: false
        type: string
  repository_dispatch:
    types: [container-build]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag/app_main (wf + repo_dispatch)
        id: resolve
        env:
          IN_TAG_WF: ${{ github.event.inputs.tag }}
          IN_TAG_RD: ${{ github.event.client_payload.tag }}
          IN_APP_WF: ${{ github.event.inputs.app_main }}
          IN_APP_RD: ${{ github.event.client_payload.app_main }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${IN_TAG_WF:-}"; [ -z "$TAG" ] && TAG="${IN_TAG_RD:-}"
          if [ -z "$TAG" ] && [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          if [ -z "$TAG" ]; then
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            TAG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g')"
          fi
          APP_MAIN="${IN_APP_WF:-}"; [ -z "$APP_MAIN" ] && APP_MAIN="${IN_APP_RD:-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_main=$APP_MAIN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Debug: show ref & Dockerfile head
        run: |
          echo "REF: ${{ github.ref }}  HEAD_REF: ${{ github.head_ref }}"
          git log -1 --oneline -- Dockerfile || true
          head -n 60 Dockerfile || sed -n "1,60p" Dockerfile

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.resolve.outputs.tag }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=thomasd
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.resolve.outputs.tag }}
            APP_MAIN=${{ steps.resolve.outputs.app_main }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
