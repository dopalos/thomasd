name: docker-images-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (optional)"
        required: false
        type: string
      app_main:
        description: "Main package path (e.g., ./cmd/thomasd)"
        required: false
        type: string
  repository_dispatch:
    types: [container-build]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve inputs
        id: r
        shell: bash
        run: |
          set -euo pipefail
          IN_TAG_WF="${{ github.event.inputs.tag }}"
          IN_TAG_RD="${{ github.event.client_payload.tag }}"
          IN_APP_WF="${{ github.event.inputs.app_main }}"
          IN_APP_RD="${{ github.event.client_payload.app_main }}"

          if [[ -n "${IN_TAG_WF:-}" ]]; then
            TAG="$IN_TAG_WF"
          elif [[ -n "${IN_TAG_RD:-}" ]]; then
            TAG="$IN_TAG_RD"
          elif [[ "${GITHUB_REF:-}" =~ ^refs/tags/ ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            TAG="$(echo "$REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g')"
          fi

          APP_MAIN="${IN_APP_WF:-${IN_APP_RD:-}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_main=$APP_MAIN" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.r.outputs.tag }}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.r.outputs.tag }}
            APP_MAIN=${{ steps.r.outputs.app_main }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
