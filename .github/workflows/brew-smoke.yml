name: brew-smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.24)"
        required: true
        type: string

jobs:
  brew-smoke:
    name: Brew smoke on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-13, runner: macos-13 }
          - { name: macos-14, runner: macos-14-arm64 }

    steps:
      - name: Prep Homebrew
        run: |
          set -euo pipefail
          brew update
          # tap이 있을 때만 untap
          if brew tap | grep -q '^dopalos/tap$'; then
            brew untap dopalos/tap
          fi
          brew tap dopalos/tap
          brew update
          # tap이 있을 때만 untap
          if brew tap | grep -q '^dopalos/tap$'; then
            brew untap dopalos/tap
          fi
          brew tap dopalos/tap

      - name: Install thomasd from tap
        run: |
          set -euo pipefail
          brew install dopalos/tap/thomasd || brew reinstall dopalos/tap/thomasd
          thomasd -v

      - name: Quick run & health (best-effort)
        run: |
          set -euo pipefail
          (nohup thomasd >/tmp/thomasd.log 2>&1 & echo $! > /tmp/thomasd.pid) || true
          sleep 1
          curl -fsS http://127.0.0.1:8081/health || true
          if [ -f /tmp/thomasd.pid ]; then kill $(cat /tmp/thomasd.pid) || true; fi
