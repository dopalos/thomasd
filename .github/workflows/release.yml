name: release-assets

on:
  release:
    types: [published]        # 릴리스 공개 시 자동 실행
  workflow_dispatch:          # 필요 시 수동 실행
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g., v0.1.6)'
        required: false

jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Merge OpenAPI fragments
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\openapi\merge_openapi.ps1
          Get-Item .\server\static\openapi\merged.json | Format-List *

      - name: Generate Postman collection
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\openapi\write-postman.ps1 `
            -Merged .\server\static\openapi\merged.json `
            -Out .\dist\thomasd-postman.json `
            -BaseForVar "http://127.0.0.1:62533"
          Get-Item .\dist\thomasd-postman.json | Format-List *

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # release 이벤트면 github.ref_name(=태그), 수동 실행이면 입력값 사용
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            server/static/openapi/merged.json
            dist/thomasd-postman.json
