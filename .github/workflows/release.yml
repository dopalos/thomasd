name: release-assets
on:
  release:
    types: [published]   # GitHub Release 공개 시 동작
jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Merge OpenAPI fragments
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\openapi\merge_openapi.ps1
          Get-Item .\server\static\openapi\merged.json | Format-List *

      - name: Generate Postman collection
        shell: pwsh
        run: |
          http://127.0.0.1:63957 = "http://127.0.0.1:62533"
          powershell -NoProfile -ExecutionPolicy Bypass 
            -File .\tools\openapi\write-postman.ps1 
            -Merged .\server\static\openapi\merged.json 
            -Out .\dist\thomasd-postman.json 
            -BaseForVar http://127.0.0.1:63957
          Get-Item .\dist\thomasd-postman.json | Format-List *

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/static/openapi/merged.json
            dist/thomasd-postman.json
