name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to upload assets to"
        required: true

jobs:
  build-and-upload:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      # 🔧 여기가 핵심: 이벤트에 따라 태그 결정을 출력으로 전달
      - name: Resolve tag
        id: prep
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            "tag=${{ inputs.tag }}" >> $env:GITHUB_OUTPUT
          }
          "Resolved tag: ${{ steps.prep.outputs.tag }}"

      - name: Merge OpenAPI fragments
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\openapi\merge_openapi.ps1
          Get-Item .\server\static\openapi\merged.json | Format-List *

      - name: Generate Postman collection
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\openapi\write-postman.ps1 `
            -Merged .\server\static\openapi\merged.json `
            -Out .\dist\thomasd-postman.json `
            -BaseForVar "http://127.0.0.1:62533"
          Get-Item .\dist\thomasd-postman.json | Format-List *

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          files: |
            server/static/openapi/merged.json
            dist/thomasd-postman.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
