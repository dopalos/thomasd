name: release-assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload assets to (e.g., v0.1.6)'
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-2022
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
          cache: true

      - name: Merge OpenAPI fragments
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\openapi\merge_openapi.ps1
          Get-Item .\server\static\openapi\merged.json | Format-List *

      - name: Generate Postman collection
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\openapi\write-postman.ps1 `
            -Merged .\server\static\openapi\merged.json `
            -Out .\dist\thomasd-postman.json `
            -BaseForVar "http://127.0.0.1:62533"
          Get-Item .\dist\thomasd-postman.json | Format-List *

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          # release 이벤트면 해당 릴리스 태그로, 수동 dispatch면 입력값(tag)으로
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          files: |
            server/static/openapi/merged.json
            dist/thomasd-postman.json
          fail_on_unmatched_files: true
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

