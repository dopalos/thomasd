name: light-smoke (CI)

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # === 임시 하네스: 러너 안에서 즉석으로 라이트 라우터 모의 서버 작성·빌드 ===
      # 실제 라우터 메인이 준비되면 이 블록을 제거하고,
      # 리포의 cmd/lightrouter/main.go를 빌드해서 실행하는 단계로 대체하세요.
      - name: Write tiny light-router harness (TEMP)
        run: |
          set -eux
          cat > light_main.go << 'EOF'
          package main

          import (
            "fmt"
            "log"
            "net/http"
            "os"
            "strconv"
            "sync/atomic"
            "time"
          )

          var (
            height uint64
            notFound uint64
            policyConflict uint64
            minFeeMas int64 = 1
          )

          func metrics(w http.ResponseWriter, r *http.Request) {
            // 아주 단순한 텍스트 메트릭스
            fmt.Fprintf(w, "router_height %d\n", atomic.LoadUint64(&height))
            fmt.Fprintf(w, "router_not_found_total %d\n", atomic.LoadUint64(&notFound))
            fmt.Fprintf(w, "router_policy_conflict_total %d\n", atomic.LoadUint64(&policyConflict))
          }

          func main() {
            // 환경/플래그 모사: THOMASD_MIN_FEE_MAS 있으면 반영
            if v := os.Getenv("THOMASD_MIN_FEE_MAS"); v != "" {
              if n, err := strconv.ParseInt(v, 10, 64); err == nil {
                minFeeMas = n
              }
            }
            addr := ":8081"
            if v := os.Getenv("THOMASD_ADDR"); v != "" {
              addr = v
            }

            mux := http.NewServeMux()
            mux.HandleFunc("/height", func(w http.ResponseWriter, r *http.Request) {
              // height 증가 느낌만
              h := atomic.AddUint64(&height, 1)
              fmt.Fprintf(w, "%d", h)
            })
            mux.HandleFunc("/hash", func(w http.ResponseWriter, r *http.Request) {
              // 해시도 흉내만 (시간기반)
              fmt.Fprintf(w, "hash_%d", time.Now().UnixNano())
            })
            mux.HandleFunc("/metrics", metrics)

            // 존재하지 않는 /nonce에 대한 404 카운트
            mux.HandleFunc("/nonce", func(w http.ResponseWriter, r *http.Request) {
              atomic.AddUint64(&notFound, 1)
              http.NotFound(w, r)
            })

            // 정책 위반 409 모사: /policy?min_fee_mas=<n>, n < minFeeMas면 409
            mux.HandleFunc("/policy", func(w http.ResponseWriter, r *http.Request) {
              q := r.URL.Query().Get("min_fee_mas")
              n, _ := strconv.ParseInt(q, 10, 64)
              if n < minFeeMas {
                atomic.AddUint64(&policyConflict, 1)
                w.WriteHeader(http.StatusConflict) // 409
                fmt.Fprintf(w, `{"error":"policy_conflict","need_min_fee_mas":%d}`, minFeeMas)
                return
              }
              w.WriteHeader(http.StatusOK)
              fmt.Fprintf(w, `{"ok":true}`)
            })

            log.Printf("TEMP harness listening on %s (min_fee_mas=%d)", addr, minFeeMas)
            if err := http.ListenAndServe(addr, mux); err != nil {
              log.Fatal(err)
            }
          }
          EOF
          go build -o lrouter ./light_main.go

      - name: Run router (background)
        run: |
          set -eux
          THOMASD_ADDR=":8081" THOMASD_MIN_FEE_MAS="1" ./lrouter > router.log 2>&1 &
          # 간단한 readiness 대기
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/height >/dev/null && break || true
            sleep 1
          done
          # 한 번 더 높이/해시 찍어둠
          curl -sf http://127.0.0.1:8081/height | tee -a router.log
          echo >> router.log
          curl -sf http://127.0.0.1:8081/hash | tee -a router.log
          echo >> router.log

      - name: Metrics BEFORE
        run: |
          set -eux
          curl -sf http://127.0.0.1:8081/metrics | tee metrics_before.txt

      - name: Smoke (inline curl)
        run: |
          set -eux
          base="http://127.0.0.1:8081"

          {
            echo "== HEIGHT =="
            curl -sf "$base/height"
            echo
            echo "== HASH =="
            curl -sf "$base/hash"
            echo
            echo "== NEGATIVES =="

            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/nonce")
            echo "nonce http_code=$code"

            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/policy?min_fee_mas=0")
            echo "policy http_code=$code"
          } | tee smoke.log

      - name: Metrics AFTER + diff
        run: |
          set -eux
          curl -sf http://127.0.0.1:8081/metrics | tee metrics_after.txt
          diff -u metrics_before.txt metrics_after.txt > metrics_diff.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-smoke-artifacts
          path: |
            router.log
            smoke.log
            metrics_before.txt
            metrics_after.txt
            metrics_diff.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          pkill -f "./lrouter" || true
