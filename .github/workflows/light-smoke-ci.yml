name: light-smoke (CI)

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Router image digest (e.g. sha256:46ef?ea051)"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Pull image by digest
        run: |
          docker pull ghcr.io/dopalos/thomasd@${{ inputs.digest }}

      - name: Run router (bg)
        run: |
          docker run -d --name lrouter -p 8081:8081 ghcr.io/dopalos/thomasd@${{ inputs.digest }}
          sleep 1
          docker logs lrouter > router.log 2>&1 || true

      - name: Wait until router is ready
        run: |
          set +e
          base="http://127.0.0.1:8081"
          for i in $(seq 1 30); do
            curl -sS "$base/height" >/dev/null && exit 0
            sleep 1
          done
          echo "router not ready in time" >> router.log
          exit 0

      - name: Metrics BEFORE
        run: |
          curl -sS http://127.0.0.1:8081/metrics -o metrics_before.txt || true

      - name: Smoke (inline curl)
        run: |
          set +e
          base="http://127.0.0.1:8081"
          {
            echo "== HEIGHT ==";
            curl -sS "$base/height" || true
            echo "== HASH ==";
            curl -sS "$base/hash"   || true
            echo "== NEGATIVES ==";
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/nonce"); echo "nonce http_code=$code"
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$base/sign" -H 'Content-Type: application/json' --data '{"m":"00"}'); echo "policy http_code=$code"
          } | tee smoke.log
          exit 0

      - name: Metrics AFTER
        run: |
          curl -sS http://127.0.0.1:8081/metrics -o metrics_after.txt || true
          (diff -u metrics_before.txt metrics_after.txt || true) > metrics_diff.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-smoke-artifacts
          path: |
            smoke.log
            router.log
            metrics_before.txt
            metrics_after.txt
            metrics_diff.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          docker rm -f lrouter || true
