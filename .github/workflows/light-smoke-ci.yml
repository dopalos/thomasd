name: light-smoke (CI)

on:
  workflow_dispatch:
    inputs:
      min_fee_mas:
        description: "Minimum fee (mas) for policy check"
        required: false
        type: string
        default: "1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build light router
        run: |
          set -euo pipefail
          if [ -f "./cmd/lightrouter/main.go" ]; then
            go build -tags light_client -o lrouter ./cmd/lightrouter
          else
            echo "cannot find ./cmd/lightrouter/main.go (경로 맞게 수정 필요)"
            exit 1
          fi
          ls -l lrouter

      - name: Run router (background)
        env:
          THOMASD_MIN_FEE_MAS: ${{ inputs.min_fee_mas }}
        run: |
          set -euo pipefail
          # 필요시 포트/플래그 조정
          ./lrouter -min-fee-mas "${THOMASD_MIN_FEE_MAS}" >/dev/null 2>router.log &
          echo $! > router.pid

          echo "Waiting for router on http://127.0.0.1:8081 ..."
          for i in $(seq 1 30); do
            sleep 1
            if curl -sf http://127.0.0.1:8081/height >/dev/null; then
              echo "router is ready"
              exit 0
            fi
          done
          echo "router not ready in time" | tee -a router.log
          exit 1

      - name: Metrics BEFORE
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8081/metrics > metrics_before.txt || true

      - name: Smoke (inline curl)
        run: |
          set -euo pipefail
          base="http://127.0.0.1:8081"
          : > smoke.log

          echo "== HEIGHT ==" | tee -a smoke.log
          curl -sf "$base/height" | tee -a smoke.log || echo "(height failed)" | tee -a smoke.log
          echo "" | tee -a smoke.log

          echo "== HASH ==" | tee -a smoke.log
          curl -sf "$base/hash" | tee -a smoke.log || echo "(hash failed)" | tee -a smoke.log
          echo "" | tee -a smoke.log

          echo "== NEGATIVES ==" | tee -a smoke.log
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/nonce")
          echo "nonce http_code=$code" | tee -a smoke.log

          # 만약 정책 409를 유도할 엔드포인트가 다르면 아래를 실제 경로로 바꿔
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/policy?min_fee_mas=0")
          echo "policy http_code=$code" | tee -a smoke.log

          # 실패해도 전체 잡은 계속 흐르게 유지
          true

      - name: Metrics AFTER + diff
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8081/metrics > metrics_after.txt || true
          diff -u metrics_before.txt metrics_after.txt > metrics_diff.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-smoke-artifacts
          path: |
            router.log
            smoke.log
            metrics_before.txt
            metrics_after.txt
            metrics_diff.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          if [ -f router.pid ]; then
            kill "$(cat router.pid)" || true
          fi
