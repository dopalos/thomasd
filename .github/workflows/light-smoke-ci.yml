name: light-smoke (CI)

on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Router image digest (e.g. sha256:46ef?ea051)"
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Pull image by digest
        run: |
          docker pull ghcr.io/dopalos/thomasd@${{ inputs.digest }}

      - name: Run router (bg)
        run: |
          docker run -d --name lrouter -p 8081:8081 ghcr.io/dopalos/thomasd@${{ inputs.digest }}
          sleep 2
          docker logs lrouter > router.log 2>&1 || true

      - name: Metrics BEFORE
        run: |
          curl -sf http://127.0.0.1:8081/metrics | tee metrics_before.txt || true

      - name: Smoke (inline curl)
        shell: bash
        run: |
          set -euxo pipefail
          base=http://127.0.0.1:8081

          # basic checks (?? ???? ??? ????)
          curl -sf "$base/height" | tee -a smoke.log || true
          echo >> smoke.log
          curl -sf "$base/hash"   | tee -a smoke.log || true
          echo >> smoke.log

          # 404 negative
          code=$(curl -s -o /dev/null -w "%{http_code}" "$base/nonce/THIS_ADDR_DOES_NOT_EXIST" || true)
          echo "nonce 404 code=$code" | tee -a smoke.log
          test "$code" -eq 404

          # 409 policy conflict (?? ?? 409/400/422)
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"min_fee_mas":999999,"tx":{"chain_id":"test","data":"00"}}' \
            "$base/tx" || true)
          echo "policy reject code=$code" | tee -a smoke.log
          if [ "$code" != "409" ] && [ "$code" != "400" ] && [ "$code" != "422" ]; then
            echo "unexpected policy code=$code"; exit 1
          fi

      - name: Metrics AFTER
        run: |
          curl -sf http://127.0.0.1:8081/metrics | tee metrics_after.txt || true
          diff -u metrics_before.txt metrics_after.txt > metrics_diff.txt || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: light-smoke-artifacts
          path: |
            smoke.log
            router.log
            metrics_before.txt
            metrics_after.txt
            metrics_diff.txt
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: docker rm -f lrouter || true
